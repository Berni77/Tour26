<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seidltour">
<title>Seidltour 2026</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f3e3c3; color: #3b2314;
    font-family: "Avenir Next", "Trebuchet MS", "Futura", -apple-system, system-ui, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none; -webkit-user-select: none;
  }
  .top { padding: 14px 20px 0; display: flex; justify-content: space-between; align-items: center; font-size: 15px; opacity: .75; }
  .bar { height: 12px; margin: 10px 20px 0; background: #e3cc9f; border: 3px solid #3b2314; border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #d9531e; width: 0; transition: width .25s; }
  .beer { display: flex; align-items: center; gap: 14px; margin: 12px 22px 0; }
  .beer svg { height: 64px; width: auto; flex: none; overflow: visible; }
  #liq { transition: transform .8s cubic-bezier(.3,1.3,.5,1); }
  #foam { transition: opacity .4s; }
  .bub { animation: rise 2.4s linear infinite; }
  .b2 { animation-delay: .8s; animation-duration: 3s; }
  .b3 { animation-delay: 1.6s; animation-duration: 2.7s; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-50px); opacity: 0; } }
  .lit { font-size: 9vw; font-weight: 900; color: #d9531e; line-height: 1; }
  .lit.pop { animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .bc { font-size: 4.6vw; opacity: .75; margin-top: 4px; font-weight: 600; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 22px; gap: 14px; }
  .nr { font-size: 18vw; line-height: .9; font-weight: 900; color: #d9531e; letter-spacing: -2px; }
  .bez { font-size: 7vw; font-weight: 600; opacity: .8; }
  .name { font-size: 11vw; line-height: 1.02; font-weight: 800; word-break: break-word; hyphens: auto; }
  .adr { font-size: 6.4vw; opacity: .9; }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none; border: 0;
    border-radius: 22px; font-weight: 800; font-family: inherit; cursor: pointer;
  }
  .btn { border: 4px solid #3b2314; box-shadow: 0 6px 0 #3b2314; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #3b2314; }
  .maps { background: transparent; color: #3b2314; font-size: 7vw; padding: 22px 10px; }
  .next { background: #d9531e; color: #fff7e0; font-size: 9vw; padding: 30px 10px; }
  .actions { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .back { background: none; border: 0; color: #3b2314; opacity: .8; font-size: 6vw; font-weight: 700; padding: 16px 8px; font-family: inherit; }
  .done { text-align: center; }
  .done .name { font-size: 16vw; }
  @media (min-width: 600px) { .nr{font-size:110px} .bez{font-size:34px} .name{font-size:56px} .adr{font-size:30px} .maps{font-size:32px} .next{font-size:42px} .done .name{font-size:80px} }
</style>
</head>
<body>
<div class="top"><span id="count"></span><span>Seidltour 2026</span></div>
<div class="bar"><i id="prog"></i></div>
<div class="beer">
  <svg viewBox="0 0 64 90" aria-hidden="true">
    <defs><clipPath id="clip"><rect x="8" y="8" width="38" height="74" rx="4"/></clipPath></defs>
    <path d="M46 24 h8 a6 6 0 0 1 6 6 v26 a6 6 0 0 1 -6 6 h-8" fill="none" stroke="#3b2314" stroke-width="5"/>
    <rect x="8" y="8" width="38" height="74" rx="4" fill="#fff7e0"/>
    <g clip-path="url(#clip)">
      <g id="liq" style="transform:translateY(68px)">
        <rect x="8" y="14" width="38" height="70" fill="#f0a202"/>
        <rect id="foam" x="8" y="8" width="38" height="8" fill="#fff7e0" style="opacity:0"/>
        <circle class="bub b1" cx="18" cy="76" r="1.8" fill="#fff7e0"/>
        <circle class="bub b2" cx="30" cy="78" r="1.4" fill="#fff7e0"/>
        <circle class="bub b3" cx="38" cy="74" r="2" fill="#fff7e0"/>
      </g>
    </g>
    <rect x="8" y="8" width="38" height="74" rx="4" fill="none" stroke="#3b2314" stroke-width="4"/>
  </svg>
  <div><div class="lit" id="lit"></div></div>
</div>
<div class="main" id="main"></div>
<div class="actions" id="actions"></div>

<script>
const S = [
  [22, "Café Falk", "Wagramer Straße 137"],
  [21, "Stehbuffet", "Franz-Jonas-Platz 8"],
  [20, "Mampf", "Hellwagstraße 7"],
  [2, "schöne Perle", "Große Pfarrgasse 2"],
  [1, "Café Votiv", "Reichsratsstraße 17"],
  [9, "Gangl", "Alser Straße 4, Hof 1"],
  [8, "Alser Café", "Alser Straße 29"],
  [19, "Pezis Café-Eck", "Heiligenstädter Straße 111"],
  [18, "Centimeter", "Gersthofer Straße 51"],
  [17, "Café Pub Weinhold", "Hernalser Hauptstraße 210"],
  [16, "Heuriger 10er Marie", "Ottakringer Straße 222-224"],
  [14, "Odysseus", "Penzinger Straße 57"],
  [13, "Da Ferdinando", "Hietzinger Hauptstraße 26"],
  [15, "Callisto Lounge", "Stiegergasse 6"],
  [23, "Kama & Co", "Anton-Baumgartner-Straße 44"],
  [12, "Golden Harp Meidling", "Meidlinger Hauptstraße 82"],
  [10, "Fladerei", "Favoritenstraße 67"],
  [4, "Südtiroler Platz", "Südtiroler Platz 8/3, 1040 Wien"],
  [3, "Pozzuoli", "Fasangasse 7"],
  [11, "Golden Harp Simmering", "Simmeringer Hauptstraße 50"],
  [7, "Café Europa", "Zollergasse 8"],
  [6, "Wind & Mill’s", "Gumpendorfer Straße 50"],
  [5, "The Black Sheep", "Kettenbrückengasse 7"],
];
const KEY = "seidltour2026";
let i = 0;
try { i = Math.min(Math.max(parseInt(localStorage.getItem(KEY)) || 0, 0), S.length); } catch (e) {}

const $ = id => document.getElementById(id);
function esc(t){ return t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function save(){ try { localStorage.setItem(KEY, i); } catch (e) {} }

function mapsUrl(s){
  const q = s[1] === "Südtiroler Platz" ? s[2] : `${s[1]}, ${s[2]}, Wien`;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

let lastI = -1;
function beer(){
  const n = Math.min(i + 1, S.length);
  const f = n / S.length;
  $("liq").style.transform = `translateY(${(1 - f) * 68}px)`;
  $("foam").style.opacity = n > 0 ? 1 : 0;
  const l = (n * 0.33).toFixed(2).replace(".", ",");
  $("lit").textContent = l + " Liter";
  if (lastI !== -1 && lastI !== n) {
    $("lit").classList.remove("pop"); void $("lit").offsetWidth; $("lit").classList.add("pop");
  }
  lastI = n;
}
function render(){
  save();
  beer();
  $("prog").style.width = (Math.min(i, S.length) / S.length * 100) + "%";
  if (i >= S.length) {
    $("count").textContent = "Fertig";
    $("main").innerHTML = '<div class="done"><div class="nr">🍺</div><div class="name">Geschafft!</div><div class="adr">Alle 23 Stationen</div></div>';
    $("actions").innerHTML = '<button class="back" id="back">← Zurück</button><button class="btn next" id="reset">Neu starten</button>';
    $("back").onclick = () => { i--; render(); };
    $("reset").onclick = () => { i = 0; render(); };
    return;
  }
  const s = S[i];
  $("count").textContent = `Station ${i + 1} von ${S.length}`;
  $("main").innerHTML =
    `<div class="nr">${String(i + 1).padStart(2, "0")}</div>` +
    `<div class="bez">${s[0]}. Bezirk</div>` +
    `<div class="name">${esc(s[1])}</div>` +
    `<div class="adr">${esc(s[2])}</div>`;
  $("actions").innerHTML =
    `<a class="btn maps" href="${mapsUrl(s)}" target="_blank" rel="noopener">📍 In Google Maps</a>` +
    `<button class="btn next" id="next">${i === S.length - 1 ? "Fertig ✓" : "Weiter →"}</button>` +
    (i > 0 ? '<button class="back" id="back">← Zurück</button>' : '');
  $("next").onclick = () => { i++; render(); };
  if (i > 0) $("back").onclick = () => { i--; render(); };
}
render();
</script>
</body>
</html>
